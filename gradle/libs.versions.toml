# JRomManager centralized dependency + plugin catalog.
# Single source of truth for every version used by the root build and its
# subprojects. WebClient is a separate submodule repo (JRomManager-WebClient)
# with its own floating versions; mirror the relevant pins there with a
# companion commit when refreshing (the refresh script prints the values).
#
# Refresh policy: versions are bumped by editing this file, then running
# `scripts/refresh-locks.sh` (re-resolves everything, regenerates locks,
# propagates literal-only pins). `scripts/update-verification-metadata.sh`
# re-records checksums/signatures afterwards. Plugin pins are refreshed
# manually (check the plugin portal) since plugin markers are not part of
# the project dependency graph.

[versions]
# --- Gradle plugins (root + WebClient standalone) ---
sonarqube = "7.3.1.8318"
nebula-ospackage = "12.3.0"
gradle-download-task = "5.7.0"
freefair-lombok = "9.8.0"
javafx-plugin = "0.1.0"
beryx-jlink = "4.1.1"
javadoc-links = "0.10.0"
graalvm-native = "1.1.14"
foojay-resolver = "1.0.0"
gwt-gradle = "1.3.1"

# --- Java toolchains / language levels ---
java-main = "25"
java-webclient = "17"
javafx = "25"
gwt = "2.13.0"
smartgwt = "14.1"

# --- Non-catalog artifacts (downloaded zips, not Maven deps) ---
commons-daemon-dist = "1.3.3"

# --- Core libraries ---
sevenzipjbinding = "1.1"
jtrrntzip = "2.0.0"
commons-codec = "1.22.1"
commons-io = "2.22.0"
commons-text = "1.15.0"
commons-compress = "1.28.0"
commons-lang3 = "3.21.0"
streamex = "0.9.0"
jspecify = "1.0.1"
javax-activation = "1.2.0"
minimal-json = "0.9.5"
zip4j = "2.11.6"
fory = "1.6.1"
aircompressor = "2.0.3"
bouncycastle = "1.86"
jsr305 = "3.0.2"
lombok = "1.18.46"

# --- CLI / desktop ---
jcommander = "1.82"
gson = "2.14.0"
jline = "4.3.1"

# --- Server ---
commons-daemon = "1.6.1"
commons-dbutils = "1.8.1"
jetty = "12.1.12"
h2 = "2.4.240"
jbcrypt = "0.4"
jna = "5.19.1"
argon2-jvm = "2.12"
logback = "1.6.5"

# --- Testing ---
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
awaitility = "4.3.0"
testfx = "0.2.0"

