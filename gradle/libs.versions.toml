[plugins]
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
# nebula-ospackage version is consumed by buildSrc (see buildSrc/build.gradle.kts);
# the plugin itself is applied inside the jrm.packaging-ospackage precompiled plugin.
nebula-ospackage = { id = "com.netflix.nebula.ospackage", version.ref = "nebula-ospackage" }
gradle-download-task = { id = "de.undercouch.download", version.ref = "gradle-download-task" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair-lombok" }
javafx-plugin = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
beryx-jlink = { id = "org.beryx.jlink", version.ref = "beryx-jlink" }
javadoc-links = { id = "io.github.sgtsilvio.gradle.javadoc-links", version.ref = "javadoc-links" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
gwt-gradle = { id = "de.esoco.gwt", version.ref = "gwt-gradle" }

[bundles]
jetty-server-stack = ["jetty-server", "jetty-security", "jetty-session", "jetty-alpn-server", "jetty-alpn-java-server", "jetty-ee9-servlet", "jetty-ee9-security", "jetty-http2-server", "jetty-ee9-websocket-jakarta-server"]
