buildscript {
    // NOTE: `libs` is not visible inside buildscript. These pins mirror
    // gradle/libs.versions.toml (aircompressor, bouncycastle) and are kept in
    // sync by scripts/refresh-locks.sh — do not hand-edit.
    configurations.all {
        resolutionStrategy {
            force 'io.airlift:aircompressor:2.0.3'
            dependencySubstitution {
                substitute module('org.bouncycastle:bcpg-jdk15on') using module('org.bouncycastle:bcpg-jdk18on:1.86')
                substitute module('org.bouncycastle:bcprov-jdk15on') using module('org.bouncycastle:bcprov-jdk18on:1.86')
            }
        }
    }
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.nebula.ospackage)
    alias(libs.plugins.gradle.download.task)
    alias(libs.plugins.freefair.lombok)
    alias(libs.plugins.javafx.plugin)
    alias(libs.plugins.beryx.jlink) apply false
    id 'jacoco'
    alias(libs.plugins.javadoc.links)
    alias(libs.plugins.graalvm.native) apply false
}

dependencyLocking {
    lockAllConfigurations()
    // LENIENT = lock mismatches warn instead of failing the build.
    // Dynamic versions are still pinned; added/removed/shifted modules no longer error.
    lockMode = LockMode.LENIENT
}

sonar {
    properties {
        property "sonar.projectKey", "optyfr-org_JRomManager"
        property "sonar.organization", "optyfr-org"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.sourceEncoding", "utf-8"
        property "sonar.log.level", "WARNING"
        property "sonar.verbose", "false"
        property "sonar.scm.provider", "git"
        property "sonar.coverage.jacoco.xmlReportPaths", "${rootDir}/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
    }
}

tasks.register("codeCoverageReport", JacocoReport) {
    subprojects { subproject ->
        subproject.plugins.withType(JacocoPlugin).configureEach {
            subproject.tasks.matching({ t -> t.extensions.findByType(JacocoTaskExtension) }).configureEach { testTask ->
                sourceSets subproject.sourceSets.main
                executionData(testTask)
            }
        }
    }
    reports {
        xml.required = true
        html.required = true
    }
}

codeCoverageReport.dependsOn {
    subprojects*.test
}

apply plugin: 'java'

compileJava.options.encoding = 'utf-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

apply plugin: 'eclipse'
eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

lombok {
    version = libs.versions.lombok.get()
}

ext.props = new Properties()
file("dist/ver.properties").withInputStream { props.load(it) }

version = props.getProperty("Specification-Version")+'.'+props.getProperty("Implementation-Version")

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

subprojects {
    group = 'jrm'
    apply from: "$rootDir/gradle/java-conventions.gradle"
}

apply from: 'gradle/packaging-jars.gradle'
apply from: 'gradle/packaging-daemon.gradle'
apply from: 'gradle/packaging-distributions.gradle'
apply from: 'gradle/aggregated-javadoc.gradle'
apply from: 'gradle/packaging-ospackage.gradle'
apply from: 'gradle/packaging-jlink.gradle'
apply from: 'gradle/packaging-native.gradle'
