buildscript {
    configurations.all {
        resolutionStrategy {
            force 'io.airlift:aircompressor:[2.0.3,3.0)'
            dependencySubstitution {
                substitute module('org.bouncycastle:bcpg-jdk15on') using module('org.bouncycastle:bcpg-jdk18on:[1.84,2.0)')
                substitute module('org.bouncycastle:bcprov-jdk15on') using module('org.bouncycastle:bcprov-jdk18on:[1.84,2.0)')
            }
        }
    }
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java'
    id 'application'
    id "org.sonarqube" version "7.3.1.8318"
    id "com.netflix.nebula.ospackage" version "latest.release"
    id "de.undercouch.download" version "latest.release"
    id "io.freefair.lombok" version "latest.release"
    id 'org.openjfx.javafxplugin' version 'latest.release'
    id "org.beryx.jlink" version "4.1.1" apply false
    id 'jacoco'
    id "io.github.sgtsilvio.gradle.javadoc-links" version "0.10.0"
}

dependencyLocking {
    lockAllConfigurations()
}

sonar {
    properties {
        property "sonar.projectKey", "optyfr-org_JRomManager"
        property "sonar.organization", "optyfr-org"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.sourceEncoding", "utf-8"
        property "sonar.log.level", "WARNING"
        property "sonar.verbose", "false"
        property "sonar.scm.provider", "git"
        property "sonar.coverage.jacoco.xmlReportPaths", "${rootDir}/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
    }
}

tasks.register("codeCoverageReport", JacocoReport) {
    subprojects { subproject ->
        subproject.plugins.withType(JacocoPlugin).configureEach {
            subproject.tasks.matching({ t -> t.extensions.findByType(JacocoTaskExtension) }).configureEach { testTask ->
                sourceSets subproject.sourceSets.main
                executionData(testTask)
            }
        }
    }
    reports {
        xml.required = true
        html.required = true
    }
}

codeCoverageReport.dependsOn {
    subprojects*.test
}

apply plugin: 'java'

compileJava.options.encoding = 'utf-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

apply plugin: 'eclipse'
eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

lombok {
    version = '1.18.46'
}

ext.props = new Properties()
file("dist/ver.properties").withInputStream { props.load(it) }

version = props.getProperty("Specification-Version")+'.'+props.getProperty("Implementation-Version")

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven {
        url = uri("https://maven.pkg.github.com/optyfr/Jtrrntzip")
        credentials {
            username = "public"
            password = System.getenv("GITHUB_TOKEN") ?: ""
        }
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

subprojects {
    apply from: "$rootDir/gradle/java-conventions.gradle"
}

apply from: 'gradle/packaging-jars.gradle'
apply from: 'gradle/packaging-daemon.gradle'
apply from: 'gradle/packaging-distributions.gradle'
apply from: 'gradle/aggregated-javadoc.gradle'
apply from: 'gradle/packaging-ospackage.gradle'
apply from: 'gradle/packaging-jlink.gradle'
