import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

subprojects {
    apply plugin: 'java'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:deprecation']
        options.encoding = 'UTF-8'
        // WebClient uses GWT 2.13 which requires Java 17 source; pin its bytecode to 17 even on a JDK 25 toolchain.
        if (project.name == 'WebClient') {
            options.release = 17
        }
    }
    tasks.withType(AbstractTestTask).configureEach {
        failOnNoDiscoveredTests = false
    }

    version = props.getProperty("Specification-Version")+'.'+props.getProperty("Implementation-Version")
    repositories {
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/optyfr/Jtrrntzip")
            credentials {
                username = "public"
                password = "\u0067hp_6DEjEzjpKxxDeQ5s39Wfm3wOMRTrxH2L20xf"
            }
        }
        maven { url = "https://jitpack.io" }
    }

    test {
        useJUnitPlatform {
            includeEngines 'junit-jupiter'
        }
        jacoco {
            enabled = true
        }
        finalizedBy jacocoTestReport
        minHeapSize = "256m" // initial heap size
        maxHeapSize = "2G" // maximum heap size
        jvmArgs '-XX:+EnableDynamicAgentLoading',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    sonar {
        properties {
            property "sonar.projectKey", "optyfr_JRomManager"
            property "sonar.organization", "optyfr"
            property "sonar.host.url", "https://sonarcloud.io"
            property "sonar.sourceEncoding", "utf-8"
            property "sonar.log.level", "INFO"
            property "sonar.verbose", "true"
            property "sonar.scm.provider", "github"
            property "sonar.coverage.exclusions", "**/src-jfx/**/*"
            property "sonar.coverage.jacoco.xmlReportPaths", "${rootDir}/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
        }
    }

    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }
    jar {
        manifest {
            attributes(
                "Manifest-Version"     : "1.0",
                "Specification-Title"  : "JRomManager",
                "Specification-Version": props.getProperty("Specification-Version"),
                "Implementation-Title" : "jrm",
                "Implementation-Version" : props.getProperty("Implementation-Version")
            )
        }
        archiveFileName = 'jrm-' + project.name + '-' + project.version + '.jar'
    }
}

project(':jrmcore') {
    apply plugin: "io.freefair.lombok"

    apply plugin: "eclipse"

    dependencies {
        implementation 'com.github.optyfr:sevenzipjbindingallinone:1.1'
        implementation 'com.github.optyfr:jtrrntzip:1.3.1'
        implementation 'commons-codec:commons-codec:1.+'
        implementation 'commons-io:commons-io:[2.7,3.0)'
        implementation 'org.apache.commons:commons-text:1.+'
        implementation 'org.apache.commons:commons-compress:[1.21,2.0)'
        implementation 'one.util:streamex:0.9.+'
		runtimeOnly 'org.jspecify:jspecify:1.0.1'
        implementation 'com.sun.activation:javax.activation:1.2.+'
        implementation 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
        implementation 'net.lingala.zip4j:zip4j:latest.release'

        testImplementation 'org.junit.jupiter:junit-jupiter-api:latest.release'
        testImplementation 'org.junit.jupiter:junit-jupiter-engine:latest.release'
        testImplementation 'org.junit.jupiter:junit-jupiter-params:latest.release'
        testImplementation 'org.assertj:assertj-core:3.27.7'
        testImplementation 'org.mockito:mockito-core:latest.release'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:latest-release'
    }
    jar {
        manifest {
            attributes(
                "Specification-Title"  : "JRomManager Core",
                "Implementation-Title" : "jrmcore",
            )
        }
    }
    javadoc {
        dependsOn delombok
        source = fileTree("$buildDir/generated/sources/delombok/java/main") {
            include '**/*.java'
        }
        exclude '**/LICENSE'
        options {
            encoding = 'UTF-8'
            memberLevel = JavadocMemberLevel.PACKAGE
            outputLevel = JavadocOutputLevel.QUIET
            addBooleanOption('Xdoclint:all', true)
            addBooleanOption('html5', true)
            addStringOption('Xmaxwarns', '0')
            addBooleanOption('-syntax-highlight', true)
        }
    }
    apply plugin:'jacoco'
    test {
        useJUnitPlatform {
            includeEngines 'junit-jupiter'
        }
        jacocoTestReport {
            reports {
                xml.required = true
            }
        }
        finalizedBy jacocoTestReport
        testLogging {
            // set options for log level LIFECYCLE
            events  TestLogEvent.FAILED,
                    TestLogEvent.PASSED,
                    TestLogEvent.SKIPPED
            exceptionFormat = TestExceptionFormat.SHORT
            showExceptions = true
            showCauses = true
            showStackTraces = true

            // set options for log level DEBUG and INFO
            debug {
                events  TestLogEvent.STARTED,
                        TestLogEvent.FAILED,
                        TestLogEvent.PASSED,
                        TestLogEvent.SKIPPED,
                        TestLogEvent.STANDARD_ERROR,
                        TestLogEvent.STANDARD_OUT
                exceptionFormat = TestExceptionFormat.FULL
                showExceptions = true
                showCauses = true
                showStackTraces = true
            }
            info.events = debug.events
            info.exceptionFormat = debug.exceptionFormat

            addTestListener(new TestListener() {
                void aftersuite(TestDescriptor desc, TestResult result) {
                    if (!desc.parent) { // will match the outermost suite
                        def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
                        def startItem = '|  ', endItem = '  |'
                        def repeatLength = startItem.length() + output.length() + endItem.length()
                        println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
                    }
                }
            })
        }
        def tmpDir = temporaryDir;
        systemProperty "file.encoding", "utf-8"
        systemProperty 'java.io.tmpdir', "${tmpDir}"
        systemProperty 'jrommanager.dir', "${tmpDir}"
    }
}

