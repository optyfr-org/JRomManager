apply plugin: "io.freefair.lombok"
apply plugin: "eclipse"
apply plugin: 'application'

dependencies {
    implementation project(':jrmcore')
    implementation project(':res-icons')
    implementation libs.commons.codec
    implementation libs.jcommander
    implementation libs.commons.io
    implementation libs.commons.lang3
    implementation libs.streamex
    implementation libs.minimal.json
    implementation libs.javax.activation
    runtimeOnly libs.jspecify

    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

application.mainClass = 'jrm.JRomManagerMulti'

run {
    jvmArgs (
    )
}

jar {
    manifest {
        attributes(
            "Manifest-Version"     : "1.0",
            "Specification-Title"  : "JRomManager Standalone",
        )
    }
}

apply from: "$rootDir/gradle/delombok-javadoc.gradle"

javadoc {
    exclude '**/LICENSE'
}

test {
    def tmpDir = temporaryDir
    systemProperty "file.encoding", "utf-8"
    systemProperty 'java.io.tmpdir', "${tmpDir}"
    systemProperty 'jrommanager.dir', "${tmpDir}"
}

sonar {
    skipProject = true
}
