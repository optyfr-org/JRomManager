org.gradle.vfs.watch=true
org.gradle.configureondemand=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-XX:+UseParallelGC -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8

# System properties
systemProp.file.encoding = UTF-8

# Dependency verification: warn-only. Verification failures are displayed
# without failing the build (strict would fail on checksum/signature drift).
org.gradle.dependency.verification=lenient