name: Native Release

# Builds GraalVM native binaries + platform installer(s) on each OS.
# Windows/Linux/macOS-aarch64: servers + GUI native. macOS-x64: servers native
# only (GUI native link broken on Liberica NIK Standard + Xcode 26: missing
# _JNI_OnLoad_glass / glass/prism/font/iio symbols, observed on macos-x64) —
# macOS-x64 desktop users keep the JVM jpackage DMG. Manual retry with
# -PnativeGui still possible. macOS-aarch64 uses Oracle GraalVM per hypothesis
# that GraalVM + OpenJFX links where Liberica Standard does not.
# Installers are UNSIGNED (see buildSrc jrm.packaging-native signing hooks).

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      platform-tag:
        description: Artifact suffix, e.g. win-x64, linux-x64, macos-x64, macos-aarch64
        required: true
        type: string
      installer-types:
        description: jpackage installer types for this OS
        required: true
        type: string
      java-distribution:
        description: "Override JDK distribution (default auto: liberica on macOS-x64, graalvm elsewhere)"
        required: false
        type: string
        default: ''
      lfs:
        description: Fetch Git LFS files on checkout
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: ${{ inputs.lfs }}
          submodules: true
          persist-credentials: false

      - name: Set up JDK
        uses: optyfr-org/composite-actions/setup-java-gradle@f60bfcbcd50db29418641ce5d3e655479ce565ae
        with:
          # Empty input = auto: liberica on macOS-x64 (servers-only flow),
          # graalvm elsewhere (incl. macOS-aarch64 hypothesis test).
          java-distribution: ${{ inputs.java-distribution != '' && inputs.java-distribution || (inputs.platform-tag == 'macos-x64' && 'liberica' || 'graalvm') }}
          java-version: 25
          native: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev rpm fakeroot

      - name: Install Windows WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build native binaries + installers
        # Same PowerShell pitfall as the jpackage workflow: $VAR expansion and
        # ./gradlew need Git Bash on Windows runners.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_TYPES: ${{ inputs.installer-types }}
        run: ./gradlew nativeInstallers "-PnativeInstallerTypes=$INSTALLER_TYPES" --stacktrace

      - name: Smoke-test servers binary
        shell: bash
        run: |
          # Exact launcher name only: 'JRomManager-Servers*' also matches
          # app/*.cfg (observed on Windows) and would try to execute the config.
          # Installed launchers keep short names; only installer FILES carry
          # native+os+arch. macOS nests the binary at Contents/MacOS/ (depth 4),
          # so allow depth 5.
          BASE="JRomManager-Servers"
          BIN=$(find build/native-app/servers-image-parent -maxdepth 5 -type f \( -name "$BASE" -o -name "$BASE.exe" \) | head -n 1)
          echo "smoke binary: $BIN"
          test -n "$BIN" || { echo 'smoke FAILED: binary not found'; exit 1; }
          # FullServer parses args via JCommander: --help prints Usage (exit != 0
          # is expected). A GraalVM failure would show Error/ImageHeap instead.
          OUT=$("$BIN" --help 2>&1 || true)
          echo "$OUT" | head -20
          echo "$OUT" | grep -qi 'usage' || { echo 'smoke FAILED: no Usage output'; exit 1; }

      - name: Release servers installer
        uses: optyfr-org/composite-actions/upload-release-asset@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          tag: ${{ github.ref_name }}
          file: build/installer-native/servers/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for GUI native installer
        id: check-gui
        shell: bash
        run: |
          if compgen -G "build/installer-native/gui/*" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No GUI native installer (expected on macOS: GUI native disabled by default)."
          fi

      - name: Release GUI installer
        # Present on Windows/Linux; absent on macOS default flow.
        if: steps.check-gui.outputs.exists == 'true'
        uses: optyfr-org/composite-actions/upload-release-asset@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          tag: ${{ github.ref_name }}
          file: build/installer-native/gui/*
          token: ${{ secrets.GITHUB_TOKEN }}
