name: Release

on:
  push:
    tags:
    - '*'

permissions:
  contents: read

jobs:

  prepare:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: optyfr-org/composite-actions/ensure-release@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert release to draft until assets are ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft

  build_linux:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/linux-release.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build_windows:
    needs: build_linux
    permissions:
      contents: write
    uses: ./.github/workflows/jpackage-release.yml
    with:
      runner: windows-latest
      target-platform: win-x64
      installer-type: msi
      gradle-tasks: build jpackage
      extra-artifacts: build/distributions/JRomManager-*.zip

  build_macos_x64:
    needs: build_windows
    permissions:
      contents: write
    uses: ./.github/workflows/jpackage-release.yml
    with:
      runner: macos-26
      target-platform: macos-x64
      installer-type: dmg

  build_macos_aarch64:
    needs: build_windows
    permissions:
      contents: write
    uses: ./.github/workflows/jpackage-release.yml
    with:
      runner: macos-latest
      target-platform: macos-aarch64
      installer-type: dmg
